<section class="card h-100">
    <div class="card-body">
        <h4 class="card-title">{{ vehicle().name }}</h4>
        <p class="card-text mb-1"><strong>Modelo:</strong> {{ vehicle().model }}</p>
        <p class="card-text"><strong>Tripulante:</strong> {{ vehicle().crew }}</p>
        <button type="button" class="btn btn-primary" (click)="emitVehicleClicked()">Ver detalles</button>
    </div>
</section>
