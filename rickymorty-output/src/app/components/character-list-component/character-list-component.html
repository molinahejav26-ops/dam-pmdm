<main class="container py-4">
    <h1 class="text-center mb-4">Personajes de Rick and Morty</h1>

    @if (loading()) {
    <p class="text-center" role="status">Cargando personajes...</p>
    } @else if (errorMessage()) {
    <p class="alert alert-danger" role="alert">{{ errorMessage() }}</p>
    } @else if (characterList().length === 0) {
    <p class="text-center">No se encontraron personajes.</p>
    } @else {
    <div class="row g-4">
        @for (c of characterList(); track c.id) {
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <app-character-item-component [character]="c"
                (characterClicked)="openCharacterModal($event)"></app-character-item-component>
        </div>
        }
    </div>
    }
</main>
