<section class="card h-100">
    <img [src]="character().image" class="card-img-top" [alt]="character().name">
    <div class="card-body">
        <h4 class="card-title">{{ character().name }}</h4>
        <p class="card-text mb-1"><strong>Estado:</strong> {{ character().status }}</p>
        <p class="card-text"><strong>Especie:</strong> {{ character().species }}</p>
        <button type="button" class="btn btn-primary" (click)="emitCharacterClicked()">Ver detalles</button>
    </div>
</section>
